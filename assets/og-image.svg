<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glowBR" cx="92%" cy="108%" r="75%">
      <stop offset="0%" stop-color="#1d6bff" stop-opacity="0.36"/>
      <stop offset="60%" stop-color="#1d6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTL" cx="4%" cy="-10%" r="55%">
      <stop offset="0%" stop-color="#1d6bff" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#1d6bff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Inter","Helvetica Neue",Helvetica,Arial,sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#05070c"/>
  <rect width="1200" height="630" fill="url(#glowBR)"/>
  <rect width="1200" height="630" fill="url(#glowTL)"/>

  <!-- wordmark -->
  <rect x="90" y="72" width="26" height="26" rx="6.5" fill="#1d6bff"/>
  <text class="t" x="130" y="92" font-size="19" font-weight="700" letter-spacing="5.2" fill="#ffffff">ASSENTUM</text>

  <!-- eyebrow -->
  <text class="t" x="90" y="294" font-size="16" font-weight="500" letter-spacing="3.4" fill="#6ed5ff">PRIVATE CAPITAL MARKETS · INSTITUTIONAL DIGITAL ASSETS</text>

  <!-- headline -->
  <text class="t" x="88" y="372" font-size="62" font-weight="700" letter-spacing="-1.4" fill="#ffffff">Real-world assets.</text>
  <text class="t" x="88" y="450" font-size="62" font-weight="700" letter-spacing="-1.4" fill="#1d6bff">Structured. Distributed.</text>

  <!-- lede -->
  <text class="t" x="90" y="518" font-size="23" fill="#c9d6e8">A private capital markets platform for institutional digital assets.</text>

  <!-- tag -->
  <line x1="90" y1="566" x2="113" y2="566" stroke="#3c485a"/>
  <text class="t" x="126" y="571" font-size="14.5" letter-spacing="3" fill="#9aa4b2">BY INTRODUCTION ONLY</text>
</svg>
